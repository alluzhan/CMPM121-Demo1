<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #ffd08a;
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      image-rendering: pixelated;
      font-family: "Comic Sans MS", cursive, sans-serif;
      color: #4a2a0a;
    }

    #app {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 16px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin: 0 0 16px;
    }

    /*Pumpkin Button*/
    #pumpkin {
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      transition: transform 0.1s;
    }
    #pumpkin img {
      width: 400px;
      max-width: 100%;
      height: auto;
      display: block;
      image-rendering: pixelated;
    }
    #pumpkin:hover {
      transform: scale(1.1);
    }
    #pumpkin:active {
      transform: scale(0.92);
    }

    /* Seed Count & Seed Rate */
    #seed-count {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      margin: 12px 0 0;
    }

    #seed-count .seed-icon {
      justify-self: end;
      width: 100px;
      height: 100px;
      image-rendering: pixelated;
    }

    #seed-count span {
      grid-column: 2;
    }

    #seed-rate {
      margin: 4px 0 20px;
      opacity: 0.8;
    }

    /* Upgrade Buttons */
    #upgrades {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    #upgrades button {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      padding: 14px;
      font-size: 1rem;
      font-family: inherit;
      border: none;
      border-radius: 12px;
      background: #fe9845;
      color: white;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    #upgrades button:hover:not(:disabled) {
      background: #d37a35;
      transform: translateY(-2px);
    }
    #upgrades button:disabled {
      background: #cdb89c;
      color: #7a6a58;
      cursor: not-allowed;
    }
    .upgrade-icon {
      width: 100px;
      height: 100px;
      image-rendering: pixelated;
    }
    </style>

    <title>Pumpkin Clicker</title>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
