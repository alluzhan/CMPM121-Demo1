<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #ffd08a;
      font-family: 'Comic Sans MS', sans-serif;
      color: #4a2a0a;
    }

    #app {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin: 0 0 16px;
    }

    /*Pumpkin Button*/
    #pumpkin {
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      transition: transform 0.1s;
    }
    #pumpkin img {
      width: 400px;
      max-width: 100%;
      height: auto;
      display: block;
      image-rendering: pixelated;
    }
    #pumpkin:hover {
      transform: scale(1.1);
    }
    #pumpkin:active {
      transform: scale(0.92);
    }

    /* Seed Count & Seed Rate */
    #seed-count {
      font-size: 2rem;
      font-weight: bold;
      margin: 12px 0 0;
    }

    #seed-rate {
      margin: 4px 0 20px;
      opacity: 0.8;
    }
    </style>

    <title>Pumpkin Clicker</title>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
